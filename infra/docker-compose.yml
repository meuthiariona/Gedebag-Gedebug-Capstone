# ============================================================================
#  Infrastruktur GIE Entertainment (kontrol keamanan DI LUAR kode aplikasi)
#
#  Arsitektur:  browser ──► nginx ──► app (php-fpm / Laravel) ──► mysql
#                                                      backup ──┘ (mysqldump terjadwal)
#
#  - nginx  : header keamanan + rate limiting login + blokir file sensitif
#  - app    : PHP-FPM dengan konfigurasi PHP yang dikeraskan
#  - mysql  : user database terpisah dengan hak minimal (least privilege)
#             + trigger yang membuat audit log benar-benar append-only
#  - backup : container terpisah, backup database otomatis + retensi + checksum
#
#  Jalankan dari folder infra/:   docker compose up -d --build
#  Lihat README.md untuk langkah lengkap.
# ============================================================================

name: gie

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi di infra/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-gie}
      DB_DATABASE: ${DB_DATABASE:-gie}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?isi di infra/.env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?isi di infra/.env}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?isi di infra/.env}
      TZ: Asia/Jakarta
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro   # membuat user saat pertama kali dijalankan
      - ./mysql/scripts:/scripts:ro                    # hardening & restore
      - ./backups:/backups:ro                          # untuk restore
    # Port database hanya dibuka ke laptop sendiri (untuk HeidiSQL/DBeaver), tidak ke jaringan.
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: ./php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Nilai ini mengalahkan isi .env project, jadi .env tidak perlu diubah.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gie}
      DB_USERNAME: gie_app                 # user dengan hak minimal (tanpa DROP/ALTER/CREATE)
      DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ..:/var/www/html
    # Tidak ada port yang dibuka: hanya nginx yang boleh bicara ke app.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"               # buka http://localhost:8080
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./logs/nginx:/var/log/nginx        # access & error log tersimpan di infra/logs/nginx

  backup:
    image: mysql:8.4                       # dipakai hanya untuk alat mysqldump-nya
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["bash", "/backup.sh"]
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-gie}
      BACKUP_DB_USER: gie_backup           # user khusus backup: hanya bisa MEMBACA
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: Asia/Jakarta
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups                 # hasil backup muncul di infra/backups (di luar container)

  # Dijalankan manual sekali: docker compose run --rm migrate
  # Memakai user "gie_migrator" yang boleh mengubah struktur tabel. Aplikasi sehari-hari TIDAK memakai user ini.
  migrate:
    build: ./php
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gie}
      DB_USERNAME: gie_migrator
      DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      SEED: ${SEED:-0}
    volumes:
      - ..:/var/www/html
    entrypoint: ["sh", "/var/www/html/infra/php/migrate.sh"]

volumes:
  mysql-data:
