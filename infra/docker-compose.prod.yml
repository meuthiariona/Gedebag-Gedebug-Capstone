# ============================================================================
#  Tambahan khusus SERVER (produksi). Dipakai bersama docker-compose.yml:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#  Biasanya tidak perlu diketik manual: jalankan deploy/deploy.sh
#
#  Perbedaan dengan lokal:
#  - Nginx terbuka ke internet di port 80/443 dengan HTTPS (Let's Encrypt)
#  - Aplikasi berjalan dalam mode production (debug mati, cookie hanya lewat HTTPS)
#  - MySQL diatur hemat memori untuk VM 1 GB
#  - Ada container scheduler untuk backup terjadwal di dalam aplikasi
# ============================================================================

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN:?isi DOMAIN di infra/.env}
  LOG_LEVEL: warning
  SESSION_SECURE_COOKIE: "true"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-gie}
  DB_USERNAME: gie_app
  DB_PASSWORD: ${APP_DB_PASSWORD}

services:
  mysql:
    # Hemat memori: VM gratis hanya punya RAM 1 GB
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=40
      - --skip-name-resolve
    ports: !reset []          # port database tidak dibuka sama sekali di server

  app:
    environment: *app-env

  scheduler:
    build: ./php
    restart: unless-stopped
    user: www-data            # file backup & log dibuat dengan pemilik yang sama dengan proses web
    depends_on:
      mysql:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ..:/var/www/html
    command: ["php", "artisan", "schedule:work"]

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  migrate:
    environment:
      COMPOSER_NO_DEV: "1"    # library khusus development tidak dipasang di server
      APP_ENV: production

  # Dipakai deploy.sh & cron untuk membuat/memperpanjang sertifikat HTTPS
  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
