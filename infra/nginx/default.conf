# ============================================================================
#  Nginx: reverse proxy + kontrol keamanan di level web server
# ============================================================================

# Rate limiting login: hanya POST /login yang dihitung (GET halaman login tidak).
# 10 percobaan per menit per IP, dengan toleransi 5 percobaan beruntun.
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Jangan tampilkan versi nginx di header & halaman error
    server_tokens off;

    # Batas ukuran upload (foto katalog & file backup 100 MB)
    client_max_body_size 110m;

    # ---------- Header keamanan (berlaku untuk SEMUA respons, termasuk file statis & halaman error) ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src https://maps.google.com https://www.google.com; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # ---------- Log ----------
    access_log /var/log/nginx/gie-access.log;
    error_log  /var/log/nginx/gie-error.log warn;

    # ---------- Blokir file tersembunyi & sensitif (.env, .git, .htaccess, dll.) ----------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(sql|bak|log|sh|zip)$ {
        deny all;
        return 404;
    }

    # ---------- Rate limiting login ----------
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---------- Teruskan ke PHP-FPM (Laravel) ----------
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;

        # Header keamanan dari aplikasi disembunyikan supaya tidak dobel;
        # sumber kebenaran header sekarang nginx (di atas).
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
        fastcgi_hide_header Content-Security-Policy;
    }

    # File .php lain di folder public tidak boleh dieksekusi (mencegah web shell hasil upload)
    location ~ \.php$ {
        return 404;
    }
}
