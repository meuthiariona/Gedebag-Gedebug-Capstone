# ============================================================================
#  Nginx PRODUKSI: HTTPS (Let's Encrypt) + aturan keamanan yang sama dengan lokal
#  Sertifikat dibuat oleh deploy.sh dengan nama tetap "gie".
# ============================================================================

map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:10m rate=10r/m;

# ---------- HTTP: hanya untuk verifikasi Let's Encrypt, sisanya dialihkan ke HTTPS ----------
server {
    listen 80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gie/privkey.pem;

    # Hanya TLS modern; protokol lama (TLS 1.0/1.1) dimatikan
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: browser diwajibkan selalu memakai HTTPS ke situs ini selama 1 tahun
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/gie-app.conf;
}
