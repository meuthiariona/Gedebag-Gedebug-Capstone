; Pengaturan proses web PHP-FPM
[www]
; Fungsi untuk menjalankan perintah sistem dimatikan untuk proses web.
; Jika ada celah upload/eksekusi kode, penyerang tidak bisa menjalankan perintah OS.
; (Perintah terminal seperti composer & artisan tidak terpengaruh.)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Batas jumlah proses supaya server tidak kehabisan memori saat diserang banyak request
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
