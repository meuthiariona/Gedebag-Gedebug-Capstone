; Hardening PHP

; Jangan umumkan versi PHP (header X-Powered-By)
expose_php = Off

; Error tidak ditampilkan ke pengunjung, cukup dicatat di log
display_errors = Off
display_startup_errors = Off
log_errors = On

; Cookie sesi tidak bisa dibaca JavaScript & hanya dikirim dari situs sendiri
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Tidak boleh membuka file dari URL lewat include/require
allow_url_include = Off

; Batas upload (foto katalog & file backup)
upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 256M
max_execution_time = 120
